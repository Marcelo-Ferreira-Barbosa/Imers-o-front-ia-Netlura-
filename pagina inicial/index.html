<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlura</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/index.js" defer></script>
</head>
<body class="intro-active">
    <div class="intro-screen" data-intro aria-hidden="true">
        <div class="intro-brand">
            <p class="intro-kicker">NETLURA</p>
            <h2>Preparando sua sessão</h2>
            <div class="intro-line"></div>
        </div>
    </div>
    <main>
        <div class="theme-actions">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Ativar modo claro" aria-pressed="false"></button>
        </div>
        <section aria-labelledby="profiles-title">
            <h1 id="profiles-title">Quem está assistindo?</h1>
            <ul class="profile-groups" aria-label="Categorias de perfis">
                <li>
                    <ul class="profiles" aria-label="Perfis disponíveis">
                        <li class="profile">
                            <button type="button" aria-label="Selecionar Perfil 1">
                                <figure>
                                    <img src="../assets/perfil-1.png" alt="Imagem de um avatar de um homem sério com cartacterísticas de cyberpunk">
                                    <figcaption>Ryan</figcaption>
                                </figure>
                            </button>
                        </li>
                        <li class="profile">
                            <button type="button" aria-label="Selecionar Perfil 2">
                                <figure>
                                    <img src="../assets/perfil-2.png" alt="Imagem de um boné azul">
                                    <figcaption>Rodrigo</figcaption>
                                </figure>
                            </button>
                        </li>
                        <li class="profile">
                            <button type="button" aria-label="Selecionar Perfil 3">
                                <figure>
                                    <img src="../assets/perfil-3.png" alt="Imagem de um boné azul">
                                    <figcaption>Kauã</figcaption>
                                </figure>
                            </button>
                        </li>
                        <li class="profile">
                            <button type="button" aria-label="Selecionar Perfil 4">
                                <figure>
                                    <img src="../assets/perfil-4.png" alt="Imagem de um boné azul">
                                    <figcaption>Taila</figcaption>
                                </figure>
                            </button>
                        </li>
                    </ul>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
