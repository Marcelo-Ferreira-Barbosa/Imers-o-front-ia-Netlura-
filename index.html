<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netlura</title>
  <style>
    :root {
      color-scheme: dark;
      --brand: #e50914;
      --brand-soft: #ff3b30;
      --bg-0: #000;
      --bg-1: #0a0a0a;
      --text: #f5f5f1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 20%, rgba(229, 9, 20, 0.3) 0%, transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(229, 9, 20, 0.22) 0%, transparent 30%),
        linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 70%, #131313 100%);
    }

    .intro {
      position: fixed;
      inset: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .intro::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: conic-gradient(from 200deg, transparent 0deg 290deg, rgba(229, 9, 20, 0.24) 330deg, transparent 360deg);
      filter: blur(50px);
      animation: glow-spin 6s linear infinite;
      z-index: -1;
    }

    .brand {
      text-align: center;
      transform: translateY(6px);
      animation: brand-in 900ms ease-out both;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(2.8rem, 13vw, 9.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
      text-shadow: 0 0 22px rgba(229, 9, 20, 0.55), 0 20px 45px rgba(0, 0, 0, 0.6);
      animation: pulse-logo 2200ms ease-in-out infinite;
    }

    .brand-subtitle {
      margin: 0.4rem 0 0;
      font-size: clamp(0.82rem, 1.4vw, 1rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(245, 245, 241, 0.86);
    }

    .progress {
      width: min(320px, 70vw);
      height: 3px;
      margin: 1rem auto 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    .progress::after {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform: scaleX(0.08);
      background: linear-gradient(90deg, var(--brand), var(--brand-soft));
      animation: progress-fill 2400ms cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    #skip-intro {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 10;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.26);
      cursor: pointer;
      color: #fff;
      background: rgba(229, 9, 20, 0.9);
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    #skip-intro:hover {
      transform: translateY(-1px);
      background: #ff1f2b;
      border-color: rgba(255, 255, 255, 0.45);
    }

    #skip-intro:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    @keyframes brand-in {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
        filter: blur(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes pulse-logo {
      0%,
      100% {
        text-shadow: 0 0 20px rgba(229, 9, 20, 0.5), 0 18px 45px rgba(0, 0, 0, 0.65);
      }

      50% {
        text-shadow: 0 0 32px rgba(229, 9, 20, 0.78), 0 24px 52px rgba(0, 0, 0, 0.7);
      }
    }

    @keyframes progress-fill {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes glow-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro::before,
      .brand-title,
      .progress::after {
        animation: none;
      }
    }

    @media (max-width: 680px) {
      .brand-title {
        letter-spacing: 0.05em;
      }

      .brand-subtitle {
        letter-spacing: 0.16em;
      }

      #skip-intro {
        padding: 9px 12px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="intro" aria-label="Introducao do site">
    <div class="brand" aria-hidden="true">
      <h1 class="brand-title">NETLURA</h1>
      <p class="brand-subtitle">Seu cinema em casa</p>
      <div class="progress"></div>
    </div>
  </main>
  <button id="skip-intro" type="button">Pular introducao</button>

  <script>
    const HOME_URL = "./pagina%20inicial/index.html";
    const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const INTRO_DURATION = REDUCE_MOTION ? 450 : 2600;

    function goToHome() {
      window.location.replace(HOME_URL);
    }

    document.getElementById("skip-intro").addEventListener("click", goToHome);
    window.setTimeout(goToHome, INTRO_DURATION);
  </script>
</body>
</html>
