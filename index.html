<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Introducao</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .intro {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .player,
    #yt-player,
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #skip-intro {
      position: fixed;
      z-index: 10;
      top: 16px;
      right: 16px;
      appearance: none;
      border: 0;
      cursor: pointer;
      color: #fff;
      background: #e50914;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 150ms ease, background-color 150ms ease;
    }

    #skip-intro:hover {
      transform: translateY(-1px);
      background: #ff1f2b;
    }
  </style>
</head>
<body>
  <main class="intro" aria-label="Introducao do site">
    <div class="player">
      <div id="yt-player"></div>
    </div>
  </main>
  <button id="skip-intro" type="button">Pular introducao</button>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const HOME_URL = "./pagina%20inicial/index.html";

    function goToHome() {
      window.location.replace(HOME_URL);
    }

    document.getElementById("skip-intro").addEventListener("click", goToHome);

    function onYouTubeIframeAPIReady() {
      new YT.Player("yt-player", {
        videoId: "GV3HUDMQ-F8",
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 1,
          rel: 0,
          playsinline: 1,
        },
        events: {
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              goToHome();
            }
          },
        },
      });
    }

    // Necessario para o callback global exigido pela API do YouTube.
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
  </script>
</body>
</html>
